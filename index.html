<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- 子どもがダブルタップ・ピンチで画面を吹き飛ばさないよう拡大を止める -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="宝箱で道具が増えていく、ブラウザで開くだけのペイント。" />
    <!-- 透過 PNG。下地の色に関係なく置ける(iOS のホーム画面だけは透明が黒く落ちるので別口) -->
    <link rel="icon" type="image/png" sizes="32x32" href="./icon/leaf-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icon/leaf-16.png" />
    <link rel="apple-touch-icon" href="./icon/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>いろは - Iroha Paint</title>
  </head>
  <body>
    <!-- ページ最上部の全幅ヘッダー。WebPaint98 / WebNP2 と同じ「ページ外側だけモダンな Web ページ」の構成。
         フッターは置かない(リンクが無く、バージョンだけのために縦を取るのは描画面積の無駄)。
         バージョンはヘッダー右端に出す。 -->
    <header class="app-header">
      <img class="app-icon" src="./icon/leaf-64.png" alt="" width="28" height="28" />
      <h1>いろは</h1>
      <p class="app-tagline">そだつ お絵かきアプリ</p>
      <span class="app-version" id="app-version"></span>
    </header>
    <div id="app" class="app bar-bottom"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
